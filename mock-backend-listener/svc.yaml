apiVersion: v1
kind: Service
metadata:
  labels:
    app: mock-backend-listener
  name: mock-backend-listener
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: mock-backend-listener
  type: ClusterIP
